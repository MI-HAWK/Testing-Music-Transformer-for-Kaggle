maestro_root: /kaggle/input/datasets/arnavsadhwani/repo-12/cp_music_transformer/maestro-v3.0.0/
midi_cache_dir: /kaggle/input/datasets/lakshaykhurana23/midi-files/cache/
max_seq_len: 512
max_position_embeddings: 4096
beat_subdivisions: 16
sustain_pedal: true
chunk_stride: 256

# MAESTRO adaptation: chord token dropped (solo piano, no chord labels)
# Exactly 6 token types: family, tempo, position_bar, pitch, duration, velocity
# [ignore] at index 0, [PAD] at index 1 in every type vocab

vocab_sizes:
  family: 6        # [ignore], [PAD], EOS, BOS, note, metric
  
  tempo: 60        # 58 bins + [ignore] + [PAD]
  position_bar: 128 # increased from 19 to handle miditok's 64 beat subdivisions + [ignore] + [PAD]
  pitch: 90        # 88 piano keys MIDI 21-108 + [ignore] + [PAD]
  duration: 128    # increased from 19 to handle miditok's generated duration tokens
  velocity: 34     # 32 bins + [ignore] + [PAD]

special_tokens:
  ignore_idx: 0         # [ignore] — inactive family slots; excluded from loss; never sampled
  pad_idx: 1            # [PAD] — sequence padding; excluded from loss; never generated
  eos_family_idx: 2     # [EOS] — signals end of piece; only in family vocab; sampled freely
  bos_family_idx: 3     # [BOS] — signals start of piece; only in family vocab; never generated mid-sequence
  note_family_idx: 4
  metric_family_idx: 5

tempo_bins:
  min_bpm: 40.0
  max_bpm: 240.0
  n_bins: 58
  scale: log             # np.logspace(log10(40), log10(240), 58)

velocity_bins:
  min_val: 0
  max_val: 127
  n_bins: 32
  scale: linear          # np.linspace(0, 127, 32)

duration_bins:
  unit: sixteenth_note
  n_bins: 17
  values: [1,2,3,4,5,6,7,8,10,12,14,16,20,24,32,48,64]

token_embed_sizes:
  family: 32
  tempo: 128
  position_bar: 64
  pitch: 512
  duration: 128
  velocity: 128

n_layers: 12
n_heads: 8
d_model: 512
d_ff: 2048             # SwiGLU inner_dim = int(d_ff * 2/3 / 64) * 64 = 1344
dropout: 0.2


sampling:
  tempo:        {tau: 1.2, top_p: 0.90}
  position_bar: {tau: 1.2, top_p: 1.00}
  pitch:        {tau: 1.0, top_p: 0.90}
  duration:     {tau: 2.0, top_p: 0.90}
  velocity:     {tau: 5.0, top_p: 1.00}
  family:       {tau: 1.0, top_p: 0.90}

epochs: 200
batch_size: 8
grad_accum_steps: 4
lr: 5.0e-5
lr_min: 5.0e-6
warmup_ratio: 0.05
betas: [0.9, 0.95]
eps: 1.0e-8
weight_decay: 0.1
max_grad_norm: 0.5
label_smoothing: 0.1
val_every_steps: 1000
save_every_steps: 1000
keep_last_n_checkpoints: 5
checkpoint_dir: /kaggle/working/checkpoints/
precision: fp16
seed: 42

early_stopping:
  enabled: false
  patience: 20
  min_delta: 1.0e-4

wandb:
  project: cp-music-transformer
  entity: null

num_gpus: 2
backend: nccl
